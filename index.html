<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a1a">
  <meta name="description" content="A minimalist reading and note-taking app">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Notes">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%231a1a1a'/><text x='50' y='68' font-size='50' text-anchor='middle' fill='white'>N</text></svg>">
  <title>Notes</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
  <div id="app">
    <header id="toolbar">
      <div class="toolbar-group">
        <button id="btn-back" class="toolbar-btn" aria-label="Back" title="Back">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <button id="btn-edit" class="toolbar-btn" aria-label="Edit" title="Edit">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        </button>
        <button id="btn-fullscreen" class="toolbar-btn" aria-label="Fullscreen" title="Fullscreen">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
        </button>
      </div>
      <div class="toolbar-group">
        <button id="btn-h1" class="toolbar-btn" aria-label="Heading 1" title="Heading 1">H1</button>
        <button id="btn-h2" class="toolbar-btn" aria-label="Heading 2" title="Heading 2">H2</button>
        <button id="btn-h3" class="toolbar-btn" aria-label="Heading 3" title="Heading 3">H3</button>
        <button id="btn-normal" class="toolbar-btn" aria-label="Normal text" title="Normal text">N</button>
        <button id="btn-bold" class="toolbar-btn" aria-label="Bold" title="Bold">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"/><path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"/></svg>
        </button>
        <button id="btn-justify" class="toolbar-btn" aria-label="Justify" title="Justify">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <button id="btn-font-increase" class="toolbar-btn font-size-btn" aria-label="Increase font size" title="Increase font size">+</button>
        <button id="btn-font-decrease" class="toolbar-btn font-size-btn" aria-label="Decrease font size" title="Decrease font size">−</button>
      </div>
      <div class="toolbar-group">
        <button id="btn-more" class="toolbar-btn" aria-label="More" title="More">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
        </button>
      </div>
    </header>

    <main id="main">
      <div id="note-list" class="view">
        <div id="list-header">
          <div>
            <h1>Notes</h1>
            <input id="search-input" type="search" placeholder="Search notes..." autocomplete="off">
          </div>
          <div style="display:flex;align-items:center;gap:10px;">
            <span id="sync-status" class="sync-status" aria-live="polite"></span>
            <button id="btn-new" class="primary-btn" aria-label="New Note" title="New Note">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>
          </div>
        </div>
        <ul id="notes-ul"></ul>
        <div id="empty-state" class="empty-state">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          <p>No notes yet</p>
          <p class="sub">Tap + to create your first note</p>
        </div>
      </div>

      <div id="note-editor" class="view hidden">
        <button id="fullscreen-back" class="fullscreen-back-btn" aria-label="Back" title="Back">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <div class="editor-header">
          <input id="note-title" type="text" placeholder="Title" autocomplete="off">
          <div class="editor-meta">
            <span id="note-date"></span>
            <span id="save-indicator" class="hidden">Saved</span>
          </div>
        </div>
        <div id="editor" contenteditable="true" placeholder="Start writing..."></div>
      </div>
    </main>

    <div id="modal-overlay" class="hidden">
      <div id="modal">
        <p id="modal-text">Are you sure?</p>
        <div class="modal-actions">
          <button id="modal-cancel" class="secondary-btn">Cancel</button>
          <button id="modal-confirm" class="danger-btn">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
